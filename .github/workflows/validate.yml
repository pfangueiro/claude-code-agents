name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels that pull request's superseded run. Pushes to main
# are grouped by their own commit, so every main commit keeps its own complete run. No job or
# gate is removed, and runs for unrelated pull requests or refs are never cancelled.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  codex-adapter:
    name: Codex adapter acceptance and mutation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe interpreter binding before the clean environment exists
        # Diagnostic only: records the tool-cache interpreter's uid/mode and the binding
        # refusal code as data; exits 0 whatever it finds.
        run: python3 -I -B tests/controller/runtime_preflight.py --observe
      - name: Create clean Python environment with a copied interpreter
        # --copies: the venv interpreter is a regular file created by this job's user
        # (venv sets 0755), instead of a symlink into the shared tool cache whose owner and
        # mode this job does not control. The controller's executable gate is unchanged.
        run: python3 -m venv --copies .ci-codex-env
      - name: Enforce controller runtime preflight
        # Fails closed unless the venv interpreter binds through the committed
        # _executable_binding gate and a host boot identity is available, so the
        # lifecycle test class cannot be skipped silently for either reason.
        run: .ci-codex-env/bin/python -I -B tests/controller/runtime_preflight.py
      - name: Install declared dependencies
        run: .ci-codex-env/bin/python -m pip install -r codex/requirements.txt
      - name: Test isolated project and user installs
        run: .ci-codex-env/bin/python -m unittest discover -s tests/codex -v
      - name: Prove ownership, rollback, patch and privacy guards
        run: .ci-codex-env/bin/python tests/codex/mutations.py

  shell-syntax:
    name: shell syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash -n every shell script
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -not -path './.claude-backup-*' \
            | xargs -I{} bash -n {}
          echo "all shell scripts pass syntax check"

  validate:
    name: ./validate.sh
    runs-on: ubuntu-latest
    needs: shell-syntax
    steps:
      - uses: actions/checkout@v5
      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: run validate.sh
        run: ./validate.sh

  gap-tests:
    # Mutation tests: prove validate.sh's guards actually detect the defects
    # their prose comments claim they detect. Runs AFTER validate, because a
    # tree that already fails validate.sh makes every mutation verdict
    # meaningless (run.sh aborts on a red baseline for the same reason).
    name: tests/gap (mutation tests for validate.sh guards)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: run mutation suite
        # --prove re-runs every mutation with the defect removed and requires the
        # assertion to fall silent. Without it a mutation whose assertion fires
        # either way would report green forever — the defect this suite exists
        # to stop, reproduced inside the suite.
        run: bash tests/gap/run.sh --prove --jobs 4

  yaml-lint:
    name: yaml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: validate yaml files
        run: |
          python3 -c "
          import sys, yaml, glob
          ok = True
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if '.git/' in f or '.claude-backup' in f:
                  continue
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'ok  {f}')
              except yaml.YAMLError as e:
                  print(f'FAIL {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
