# Optional fragment: merge only tui.status_line into the existing [tui] table of your
# Codex config (or pick items live with /statusline). The installer never edits config.
# Items are built-in Codex footer IDs; the host omits or clips them as width and runtime
# data permit. The thread title shows "SDLC | <task>" only after framework guidance is
# loaded and the model renamed the current task through a native title capability; it
# does not mean checks, review or delivery passed. No cost or token estimates are listed.
[tui]
status_line = ["thread-title", "model-with-reasoning", "git-branch", "context-used", "weekly-limit", "codex-version"]
